name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build distribution
        run: gradle installDist --no-daemon

      - name: Verify distribution
        shell: pwsh
        run: |
          $installDir = "build/install/twenty-questions"
          $libDir = Join-Path $installDir "lib"
          if (-not (Test-Path $libDir)) {
            throw "Distribution lib directory not found: $libDir"
          }
          $mainJar = Get-ChildItem $libDir -Filter "twenty-questions-*.jar" |
            Where-Object { $_.Name -notmatch 'sources|javadoc' } |
            Select-Object -First 1
          if (-not $mainJar) {
            throw "Main JAR not found in $libDir"
          }
          Write-Host "Main JAR: $($mainJar.FullName)"

      - name: Package Java-embedded EXE
        shell: pwsh
        run: |
          $installDir = "build/install/twenty-questions"
          $libDir = Join-Path $installDir "lib"
          $mainJar = Get-ChildItem $libDir -Filter "twenty-questions-*.jar" |
            Where-Object { $_.Name -notmatch 'sources|javadoc' } |
            Select-Object -First 1

          if (-not $mainJar) {
            throw "Main JAR not found in $libDir"
          }

          New-Item -ItemType Directory -Force -Path "build/package-input" | Out-Null
          Copy-Item "$libDir\*.jar" "build/package-input\" -Force
          New-Item -ItemType Directory -Force -Path "build/exe" | Out-Null

          jpackage `
            --type exe `
            --name "TwentyQuestionsAI" `
            --app-version "0.1.0" `
            --input "build/package-input" `
            --main-jar $mainJar.Name `
            --main-class "game.MainKt" `
            --dest "build/exe" `
            --win-menu `
            --win-shortcut `
            --vendor "Twenty Questions AI"

          $exe = Get-ChildItem "build/exe" -Filter "TwentyQuestionsAI-*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "jpackage did not create the EXE"
          }
          Write-Host "EXE created: $($exe.FullName)"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: twenty-questions-windows-exe
          path: build/exe/*.exe
          if-no-files-found: error

      - name: Upload JAR too
        uses: actions/upload-artifact@v4
        with:
          name: twenty-questions-jar
          path: build/libs/*.jar
          if-no-files-found: error
